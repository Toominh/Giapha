<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Image Slider</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent: #007acc;
            --border-radius: 8px;
            --control-height: 40px;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Giao diện điều khiển - Căn chỉnh đồng đều */
        .controls-container {
            background-color: var(--panel-bg);
            padding: 15px 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 100;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        label {
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
        }

        input[type="file"], select, input[type="number"], button {
            background-color: #2d2d2d;
            color: var(--text-color);
            border: 1px solid #444;
            border-radius: var(--border-radius);
            height: var(--control-height);
            padding: 0 12px;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        /* Đồng bộ chiều rộng cho select và number input để UI cân đối */
        select, input[type="number"] {
            width: 200px; 
            text-align: center;
            text-align-last: center; /* Căn giữa text trong select */
        }

        input[type="file"] {
            padding: 8px;
            width: 250px;
        }

        button {
            background-color: var(--accent);
            border: none;
            cursor: pointer;
            font-weight: bold;
            width: 120px;
        }

        button:hover {
            background-color: #0098ff;
        }

        /* Khu vực hiển thị ảnh */
        #slider-wrapper {
            position: relative;
            flex-grow: 1;
            width: 100%;
            overflow: hidden;
            background: #000;
            perspective: 1000px;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            visibility: hidden;
            z-index: 1;
        }

        .slide.active {
            opacity: 1;
            visibility: visible;
            z-index: 2;
        }

        .slide.next {
            visibility: visible;
            z-index: 3;
        }

        /* --- CÁC HIỆU ỨNG CHUYỂN ĐỔI (CSS ANIMATIONS) --- */

        /* 1. Liquid Distortion */
        .fx-liquid {
            filter: url(#liquid-filter);
            animation: fadeInOpacity var(--duration) ease-in-out forwards;
        }

        /* 2. Grainy Dissolve */
        .fx-grainy {
            mask-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noiseFilter)"/></svg>');
            animation: grainyReveal var(--duration) steps(10) forwards;
        }
        @keyframes grainyReveal {
            0% { opacity: 0; mask-size: 100%; }
            100% { opacity: 1; mask-size: 200%; }
        }

        /* 3. Parallax Depth Slide */
        .fx-parallax {
            animation: parallaxSlide var(--duration) cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        @keyframes parallaxSlide {
            0% { transform: scale(1.3) translateX(100%); opacity: 0; }
            100% { transform: scale(1) translateX(0); opacity: 1; }
        }

        /* 4. Morphing Brushes (Sử dụng Clip-path) */
        .fx-morph {
            animation: morphReveal var(--duration) cubic-bezier(0.77, 0, 0.175, 1) forwards;
        }
        @keyframes morphReveal {
            0% { clip-path: circle(0% at 50% 50%); filter: blur(10px); opacity: 0; }
            50% { clip-path: polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%); filter: blur(5px); opacity: 1;}
            100% { clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%); filter: blur(0); opacity: 1;}
        }

        /* 5. Glitch & RGB Shift */
        .fx-glitch {
            animation: glitchEffect var(--duration) linear forwards;
        }
        @keyframes glitchEffect {
            0% { transform: translate(0); filter: drop-shadow(5px 0 0 red) drop-shadow(-5px 0 0 cyan); opacity: 0.5; }
            20% { transform: translate(-10px, 5px); clip-path: inset(10% 0 50% 0); opacity: 1; }
            40% { transform: translate(10px, -5px); clip-path: inset(40% 0 10% 0); filter: drop-shadow(-10px 0 0 red) drop-shadow(10px 0 0 cyan); }
            60% { transform: translate(0); clip-path: inset(0 0 80% 0); }
            80% { transform: translate(-5px, 0); clip-path: inset(80% 0 0 0); filter: none; }
            100% { transform: translate(0); clip-path: inset(0); opacity: 1; filter: none; }
        }

        /* 6. Kinetic Typography Overlay */
        .kinetic-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 8vw;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.8);
            mix-blend-mode: overlay;
            z-index: 10;
            pointer-events: none;
            opacity: 0;
        }
        .fx-kinetic-img { animation: fadeInOpacity var(--duration) ease forwards; }
        .fx-kinetic-txt { animation: kineticFly var(--duration) cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        @keyframes kineticFly {
            0% { transform: translate(-50%, -50%) scale(0.1) rotate(-15deg); opacity: 0; letter-spacing: -20px; }
            50% { opacity: 1; letter-spacing: 20px; }
            100% { transform: translate(-50%, -50%) scale(3) rotate(5deg); opacity: 0; letter-spacing: 50px; }
        }

        /* 7. Zoom-In/Out Warp */
        .fx-zoom {
            animation: zoomWarp var(--duration) ease-out forwards;
        }
        @keyframes zoomWarp {
            0% { transform: scale(2) rotate(5deg); filter: blur(20px); opacity: 0; }
            100% { transform: scale(1) rotate(0); filter: blur(0); opacity: 1; }
        }

        /* 8. Grid Shuffle (CSS Grid + Clip Path) */
        .fx-grid {
            animation: gridShuffle var(--duration) cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        @keyframes gridShuffle {
            0% { clip-path: polygon(0 0, 0 0, 0 0, 0 0); opacity: 0; transform: scale(0.9); }
            50% { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); opacity: 0.5; }
            100% { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); opacity: 1; transform: scale(1); }
        }

        /* 9. Mask Reveal */
        .fx-mask {
            animation: maskReveal var(--duration) ease-in-out forwards;
        }
        @keyframes maskReveal {
            0% { clip-path: circle(0% at 50% 50%); opacity: 1; }
            100% { clip-path: circle(150% at 50% 50%); opacity: 1; }
        }

        /* 10. Paper Flip */
        .fx-flip {
            transform-origin: left center;
            animation: paperFlip var(--duration) cubic-bezier(0.455, 0.030, 0.515, 0.955) forwards;
        }
        @keyframes paperFlip {
            0% { transform: rotateY(-90deg); opacity: 0; }
            100% { transform: rotateY(0deg); opacity: 1; }
        }

        @keyframes fadeInOpacity {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        
        .hidden { display: none; }
    </style>
</head>
<body>

    <!-- SVG Filters ẩn dùng cho hiệu ứng -->
    <svg style="width:0;height:0;position:absolute;">
        <filter id="liquid-filter">
            <feTurbulence type="fractalNoise" baseFrequency="0.01 0.05" numOctaves="2" result="noise">
                <animate attributeName="baseFrequency" values="0.01 0.05; 0.05 0.01; 0.01 0.05" dur="3s" repeatCount="indefinite"/>
            </feTurbulence>
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="30" xChannelSelector="R" yChannelSelector="G">
                <animate attributeName="scale" values="50; 0" dur="1.5s" fill="freeze"/>
            </feDisplacementMap>
        </filter>
    </svg>

    <div class="controls-container">
        <div class="control-group">
            <label>Chọn thư mục ảnh:</label>
            <input type="file" id="folderInput" webkitdirectory directory multiple accept="image/*">
        </div>
        <div class="control-group">
            <label>Hiệu ứng:</label>
            <select id="effectSelect">
                <option value="random">🔀 Ngẫu nhiên (Random)</option>
                <option value="liquid">1. Liquid Distortion</option>
                <option value="grainy">2. Grainy Dissolve</option>
                <option value="parallax">3. Parallax Depth Slide</option>
                <option value="morph">4. Morphing Brushes</option>
                <option value="glitch">5. Glitch & RGB Shift</option>
                <option value="kinetic">6. Kinetic Typography</option>
                <option value="zoom">7. Zoom-In/Out Warp</option>
                <option value="grid">8. Grid Shuffle</option>
                <option value="mask">9. Mask Reveal</option>
                <option value="flip">10. Paper Flip</option>
            </select>
        </div>
        <div class="control-group">
            <label>Thời gian chuyển (giây):</label>
            <input type="number" id="timeInput" value="3" min="1" max="10" step="0.5">
        </div>
        <button id="toggleBtn">Bắt đầu</button>
    </div>

    <div id="slider-wrapper">
        <div class="kinetic-text" id="kineticText">TRANSITION</div>
    </div>

    <script>
        const folderInput = document.getElementById('folderInput');
        const effectSelect = document.getElementById('effectSelect');
        const timeInput = document.getElementById('timeInput');
        const toggleBtn = document.getElementById('toggleBtn');
        const sliderWrapper = document.getElementById('slider-wrapper');
        const kineticText = document.getElementById('kineticText');

        let imageUrls = [];
        let currentIndex = 0;
        let isPlaying = false;
        let slideInterval;
        let currentSlideEl = null;

        const effectsList = ['liquid', 'grainy', 'parallax', 'morph', 'glitch', 'kinetic', 'zoom', 'grid', 'mask', 'flip'];

        // Lọc và lấy ảnh từ thư mục
        folderInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            imageUrls = files
                .filter(file => file.type.startsWith('image/'))
                .map(file => URL.createObjectURL(file));

            if (imageUrls.length > 0) {
                currentIndex = 0;
                sliderWrapper.innerHTML = ''; // Clear old slides
                sliderWrapper.appendChild(kineticText); // Keep text element
                createSlide(imageUrls[currentIndex], true);
                alert(`Đã tải thành công ${imageUrls.length} ảnh!`);
            } else {
                alert('Không tìm thấy ảnh trong thư mục này.');
            }
        });

        function createSlide(url, isActive = false) {
            const slide = document.createElement('div');
            slide.className = 'slide' + (isActive ? ' active' : '');
            slide.style.backgroundImage = `url('${url}')`;
            sliderWrapper.appendChild(slide);
            if (isActive) currentSlideEl = slide;
            return slide;
        }

        function getNextEffect() {
            const selected = effectSelect.value;
            if (selected === 'random') {
                return effectsList[Math.floor(Math.random() * effectsList.length)];
            }
            return selected;
        }

        function nextSlide() {
            if (imageUrls.length < 2) return;

            const nextIndex = (currentIndex + 1) % imageUrls.length;
            const nextUrl = imageUrls[nextIndex];
            const nextSlideEl = createSlide(nextUrl);
            
            const effect = getNextEffect();
            const durationCSS = '1.5s'; // Thời gian thực thi hiệu ứng cố định để mượt mà

            // Setup custom properties
            nextSlideEl.style.setProperty('--duration', durationCSS);

            // Xử lý hiệu ứng đặc biệt
            if (effect === 'kinetic') {
                kineticText.style.setProperty('--duration', durationCSS);
                kineticText.className = 'kinetic-text fx-kinetic-txt';
                nextSlideEl.classList.add('fx-kinetic-img');
                
                // Reset animation
                kineticText.style.animation = 'none';
                void kineticText.offsetWidth; 
                kineticText.style.animation = null;
            } else {
                kineticText.className = 'kinetic-text';
                nextSlideEl.classList.add(`fx-${effect}`);
            }

            nextSlideEl.classList.add('next');

            // Sau khi hiệu ứng chạy xong
            setTimeout(() => {
                if (currentSlideEl && currentSlideEl.parentNode) {
                    currentSlideEl.parentNode.removeChild(currentSlideEl);
                }
                nextSlideEl.classList.remove('next', `fx-${effect}`, 'fx-kinetic-img');
                nextSlideEl.classList.add('active');
                currentSlideEl = nextSlideEl;
                currentIndex = nextIndex;
            }, 1500); // Đợi 1.5s cho animation hoàn tất
        }

        toggleBtn.addEventListener('click', () => {
            if (imageUrls.length === 0) {
                alert('Vui lòng chọn thư mục chứa ảnh trước!');
                return;
            }

            if (isPlaying) {
                clearInterval(slideInterval);
                toggleBtn.textContent = 'Bắt đầu';
                toggleBtn.style.backgroundColor = 'var(--accent)';
            } else {
                const intervalTime = parseFloat(timeInput.value) * 1000;
                nextSlide(); // Chuyển ngay ảnh đầu
                slideInterval = setInterval(nextSlide, intervalTime);
                toggleBtn.textContent = 'Dừng lại';
                toggleBtn.style.backgroundColor = '#d32f2f'; // Màu đỏ khi dừng
            }
            isPlaying = !isPlaying;
        });
    </script>
</body>
</html>
